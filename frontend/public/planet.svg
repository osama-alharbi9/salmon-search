<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- Seamless (horizontally tiling) painterly map for the landing planet. -->
  <filter id="map" x="0" y="0" width="800" height="400" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.016" numOctaves="5" seed="11" stitchTiles="stitch" result="land"/>
    <feTurbulence type="turbulence" baseFrequency="0.035 0.11" numOctaves="3" seed="4" stitchTiles="stitch" result="brush"/>
    <feComposite in="land" in2="brush" operator="arithmetic" k1="0" k2="1" k3="0.32" k4="-0.12" result="mix"/>
    <feColorMatrix in="mix" type="matrix" values="1.7 0 0 0 -0.38  1.7 0 0 0 -0.38  1.7 0 0 0 -0.38  0 0 0 0 1" result="grey"/>
    <feComponentTransfer in="grey">
      <feFuncR type="table" tableValues="0.10 0.16 0.20 0.30 0.52 0.70 0.86"/>
      <feFuncG type="table" tableValues="0.42 0.58 0.74 0.84 0.82 0.72 0.80"/>
      <feFuncB type="table" tableValues="0.80 0.90 0.86 0.74 0.56 0.82 0.86"/>
    </feComponentTransfer>
  </filter>
  <rect width="800" height="400" filter="url(#map)"/>
</svg>
